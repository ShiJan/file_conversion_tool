name: Portable builds
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: pwsh ./scripts/package-windows.ps1
            artifact: windows-x64
          - os: ubuntu-22.04
            script: bash ./scripts/package-unix.sh
            artifact: linux-x64
          - os: macos-15-intel
            script: bash ./scripts/package-unix.sh
            artifact: macos-intel
          - os: macos-15
            script: bash ./scripts/package-unix.sh
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ${{ matrix.script }}
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/WeChatScreenshotOrganizer-*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/tags/v1.0.0'
    needs: portable
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Verify archives and write checksums
        run: |
          set -euo pipefail
          cd release-assets
          archives=(
            WeChatScreenshotOrganizer-windows-x64.zip
            WeChatScreenshotOrganizer-linux-x86_64.tar.gz
            WeChatScreenshotOrganizer-macos-x86_64.zip
            WeChatScreenshotOrganizer-macos-arm64.zip
          )
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          for archive in "${archives[@]}"; do test -s "$archive"; done
          for archive in *.zip; do unzip -tq "$archive" >/dev/null; done
          unzip -Z1 WeChatScreenshotOrganizer-windows-x64.zip > windows-list.txt
          grep -Fxq 'WeChatScreenshotOrganizer/WeChatScreenshotOrganizer.exe' windows-list.txt
          grep -Fq 'WeChatScreenshotOrganizer/runtime/' windows-list.txt
          for archive in WeChatScreenshotOrganizer-macos-*.zip; do
            unzip -Z1 "$archive" > macos-list.txt
            grep -Fxq 'WeChatScreenshotOrganizer.app/Contents/MacOS/WeChatScreenshotOrganizer' macos-list.txt
            grep -Fxq 'WeChatScreenshotOrganizer.app/Contents/runtime/Contents/Home/lib/modules' macos-list.txt
          done
          tar -tzf WeChatScreenshotOrganizer-linux-x86_64.tar.gz > linux-list.txt
          grep -Fxq 'WeChatScreenshotOrganizer/bin/WeChatScreenshotOrganizer' linux-list.txt
          grep -Fq 'WeChatScreenshotOrganizer/lib/runtime/' linux-list.txt
          rm windows-list.txt macos-list.txt linux-list.txt
          sha256sum "${archives[@]}" > SHA256SUMS.txt
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME 稳定版" \
              --notes-file .github/release-notes/v1.0.0.md --draft=false --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag --title "$GITHUB_REF_NAME 稳定版" \
              --notes-file .github/release-notes/v1.0.0.md
          fi
